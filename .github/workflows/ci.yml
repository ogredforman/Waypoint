# Test on all three OSes, then cross-compile release binaries (PLAN 0.9).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but let every push to main finish so each commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No CGO, ever. The SQLite driver is modernc.org/sqlite (pure Go).
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Makefile is the interface CI tests, so Windows needs GNU make too.
      - name: Ensure make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command make -ErrorAction SilentlyContinue)) { choco install make -y --no-progress }

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Test
        run: make test

      # Lint results don't depend on the OS, and staticcheck and sqlc are slow to build.
      - name: Lint
        if: runner.os == 'Linux'
        run: make lint

  e2e:
    name: e2e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # make e2e installs the browser itself; this adds the system libraries Chromium needs.
      - name: Install Playwright system dependencies
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install-deps chromium

      - name: E2E
        run: make e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  build:
    name: cross-compile
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Built once into internal/web/dist, then embedded into every binary below.
      - name: Build frontend
        run: make web

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = windows ]; then ext=".exe"; fi
            out="dist/waypoint-${goos}-${goarch}${ext}"
            echo "Building $out"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "$out" ./cmd/waypoint
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: waypoint-binaries
          path: dist/
          retention-days: 7
          if-no-files-found: error
